[package]
name = "voice-inputter"
version = "0.5.0"
edition = "2021"
description = "Local streaming voice dictation for Windows with a waveform overlay"
license = "Unlicense"
repository = "https://github.com/sashape/voice-inputter"

[[bin]]
name = "voice-inputter"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
sherpa-onnx = "1.13"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_HiDpi",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
